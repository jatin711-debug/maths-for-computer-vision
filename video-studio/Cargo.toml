[package]
name = "cv-studio"
version = "0.1.0"
edition = "2024"
publish = false

# Stays out of any parent workspace.
[workspace]

[dependencies]
fframes = { version = "=1.3.0", features = ["compile-time-svgtree", "cli"] }
fframes_skia_renderer = { version = "=1.3.0", features = ["vulkan"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "cv-studio"
path = "src/main.rs"

[profile.release]
opt-level = 3
debug = false
